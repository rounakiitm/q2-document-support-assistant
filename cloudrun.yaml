# Reference config for: gcloud run services replace cloudrun.yaml
# Prefer `scripts/deploy_cloudrun.ps1` which creates/updates the service.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: q2-support-assistant
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 20
      timeoutSeconds: 3600
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: MODEL_NAME
              value: gemini-2.5-flash-lite
            - name: EMBEDDING_MODEL
              value: gemini-embedding-001
